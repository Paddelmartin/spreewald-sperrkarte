name: Spreewald-Sperrkarte täglich
on:
  schedule:
    - cron: "30 4 * * *"      # Karte aktualisieren: 04:30 UTC = 06:30 Sommerzeit / 05:30 Winterzeit (ohne Push)
    - cron: "30 6 * * *"      # Abgleich + Push: 06:30 UTC = 08:30 Sommerzeit / 07:30 Winterzeit
    - cron: "0 12 * * *"      # Abgleich + Push: 12:00 UTC = 14:00 Sommerzeit / 13:00 Winterzeit
  workflow_dispatch:
    inputs:
      testpush:
        description: "Nur eine Test-Push-Nachricht senden, um die ntfy-Einstellungen zu prüfen"
        type: boolean
        default: false
permissions: { contents: write, pages: write, id-token: write, issues: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Karte bauen und Änderungen melden
        run: python spreewald_sperrungen.py ${{ (github.event.schedule == '30 6 * * *' || github.event.schedule == '0 12 * * *' || github.event_name == 'workflow_dispatch') && '--notify' || '' }} ${{ inputs.testpush && '--test-push' || '' }}
        env:
          KONTAKT: ${{ secrets.KONTAKT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          ISSUE_FILE: ${{ vars.ISSUE_NOTIFY == 'true' && 'aenderungen.md' || '' }}
          NOTIFY_USERS: ${{ vars.NOTIFY_USERS }}
          MAP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Änderungen als GitHub-Hinweis anlegen
        if: hashFiles('aenderungen.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "$(cat aenderungen.title)" --body-file aenderungen.md
      - name: Stand für den nächsten Vergleich speichern
        run: |
          git config user.name "sperrkarte-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/letzter_stand.json || true
          git diff --cached --quiet || (git commit -m "LBV-Stand aktualisiert" && git push)
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
