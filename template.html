<style>
  :root{
    --brand-orange:#EC6D28; --brand-orange-dark:#D25A1B;
    --brand-blue:#0F63A6;   --brand-blue-dark:#0B4C80;
    --bg:#F5F7FA; --card:#fff; --line:#E1E6EC;
  }
  html,body{height:100%;margin:0;font-family:'Poppins',system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:#2b2f33}
  #wrap{display:flex;height:100%}
  #side{width:380px;max-width:42vw;overflow-y:auto;background:var(--bg);border-right:1px solid var(--line);box-sizing:border-box}
  #map{flex:1}

  #brand{display:flex;align-items:center;gap:12px;padding:14px 14px 12px;background:var(--card);
    border-bottom:3px solid var(--brand-orange);position:relative;overflow:hidden}
  #brand img{height:48px;width:auto;flex:none}
  #brand .tt{min-width:0}
  #brand .tt b{display:block;color:var(--brand-blue-dark);font-size:13px;font-weight:700;line-height:1.15}
  #brand .tt span{display:block;color:#7a8492;font-size:11px}
  .wave{position:absolute;left:0;right:0;bottom:-1px;height:10px;pointer-events:none}

  .content{padding:12px 14px}
  h1{font-size:18px;margin:2px 0 2px;color:var(--brand-blue-dark);font-weight:700}
  .sub{color:#6b7480;font-size:12.5px;margin-bottom:10px;line-height:1.4}
  .leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin-bottom:12px;color:#4a5158}
  .sw{display:inline-block;width:20px;height:0;border-top:5px solid;vertical-align:middle;margin-right:5px;border-radius:3px}

  .it{background:var(--card);border:1px solid var(--line);border-left:6px solid #999;border-radius:8px;
    padding:9px 11px;margin-bottom:9px;font-size:13px;cursor:pointer;box-shadow:0 1px 2px rgba(20,30,40,.04);
    transition:box-shadow .15s,transform .15s}
  .it:hover{box-shadow:0 3px 10px rgba(20,30,40,.10);transform:translateY(-1px)}
  .it b{display:block;color:#20262c}
  .badge{font-size:10.5px;font-weight:700;color:#fff;border-radius:999px;padding:2px 9px;margin-right:6px;
    letter-spacing:.3px;display:inline-block}
  .stale{background:#b00020;color:#fff;font-weight:700;padding:9px 11px;border-radius:8px;margin-bottom:12px;font-size:13.5px;line-height:1.4}
  .warn{color:#b00020;font-size:12px} .mut{color:#6b7480;font-size:12px}
  h2{font-size:14px;margin:14px 0 6px;color:var(--brand-blue-dark)}

  #foot{padding:14px;border-top:1px solid var(--line);font-size:11.5px;color:#8a92a0;line-height:1.6}
  #foot a{color:var(--brand-orange-dark);text-decoration:none;font-weight:600}
  #foot a:hover{text-decoration:underline}

  @media(max-width:700px){#wrap{flex-direction:column-reverse}#side{width:auto;max-width:none;height:44%}}
</style>
</head>
<body>
<div id="wrap">
  <div id="side"></div>
  <div id="map"></div>
</div>

const COL = {gesperrt:'#d32f2f', eingeschraenkt:'#f57c00', bald:'#f9a825'};
const LAB = {gesperrt:'GESPERRT', eingeschraenkt:'EINGESCHRÄNKT', bald:'DEMNÄCHST', gebiet:'GEBIETSHINWEIS', ruht:'HEUTE NICHT AKTIV'};

const map = L.map('map').setView([51.86, 13.99], 11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'© OpenStreetMap-Mitwirkende'}).addTo(map);

function el(tag, cls, text){const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e;}
function popup(it){
  const d=el('div'); const b=el('b',null,it.gewaesser); d.append(b, el('div',null,LAB[it.status]+' – '+it.bereich));
  d.append(el('div','mut','Zeitraum: '+it.zeitraum));
  if(it.grund) d.append(el('div','mut','Grund: '+it.grund));
  d.append(el('div',null,it.hinweis));
  if(it.paddel) d.append(el('div',null,'Paddelboote: Umtragen möglich'));
  if(!it.genau) d.append(el('div','warn','Abschnitt nur ungefähr eingezeichnet – Text beachten!'));
  return d;
}

const side=document.getElementById('side');

// Kopfbereich mit Logo
const brand=el('div'); brand.id='brand';
const logoImg=document.createElement('img'); logoImg.src=LOGO; logoImg.alt='Bootsverleih Richter / Kajaksports';
const tt=el('div','tt'); tt.append(el('b',null,'Bootsverleih Richter'), el('span',null,'Spreewald-Sperrkarte'));
brand.append(logoImg, tt);
const wave=document.createElementNS('http://www.w3.org/2000/svg','svg');
wave.setAttribute('class','wave'); wave.setAttribute('viewBox','0 0 400 10'); wave.setAttribute('preserveAspectRatio','none');
wave.innerHTML='<path d="M0,6 C50,0 100,10 150,5 C200,0 250,10 300,5 C350,0 375,8 400,4 L400,10 L0,10 Z" fill="#0F63A6" opacity="0.15"/>';
brand.append(wave);
side.append(brand);

const content=el('div'); content.className='content'; side.append(content);

function localIso(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');}
if(D.iso && D.iso!==localIso()){
  content.append(el('div','stale','ACHTUNG: Diese Karte zeigt die Daten vom '+D.datum+' – NICHT von heute! Nicht verwenden, bis sie aktualisiert ist.'));
}
content.append(el('h1',null,'Sperrungen – '+D.datum));
content.append(el('div','sub','Quelle: LBV Brandenburg'+(D.stand?' (Stand '+D.stand+')':'')+'. Maßgeblich bleibt die Beschilderung vor Ort.'));
const leg=el('div','leg');
['gesperrt','eingeschraenkt','bald'].forEach(k=>{const s=el('span'); const w=el('span','sw'); w.style.borderColor=COL[k]; s.append(w,LAB[k]); leg.append(s);});
content.append(leg);
if(D.erzeugt) content.append(el('div','mut','Karte erzeugt: '+D.erzeugt+' Uhr'));

const all=L.featureGroup().addTo(map);
const order={gesperrt:0,eingeschraenkt:1,bald:2,gebiet:3,ruht:4};
const items=[...D.items].sort((a,b)=>order[a.status]-order[b.status]);

items.forEach(it=>{
  const layers=[];
  const color=COL[it.status];
  (it.geom||[]).forEach(g=>{
    const opt={color, weight:7, opacity:.9, dashArray: it.status==='bald'?'10 8':null};
    const lyr = g.t==='line' ? L.polyline(g.c,opt) : L.circle(g.c,{...opt,radius:g.r,weight:5,fillOpacity:.25});
    lyr.bindPopup(()=>popup(it)); lyr.addTo(all); layers.push(lyr);
    if(g.t==='circle'){ // Punkt, der bei jedem Zoom sichtbar bleibt
      const dot=L.circleMarker(g.c,{radius:8,color:'#fff',weight:2,fillColor:color,fillOpacity:1});
      dot.bindPopup(()=>popup(it)); dot.addTo(all); layers.push(dot);
    }
  });
  const row=el('div','it'); row.style.borderLeftColor = color || '#999';
  const head=el('b'); const bd=el('span','badge',LAB[it.status]); bd.style.background=color||'#777';
  head.append(bd, it.gewaesser); row.append(head, el('div','mut',it.bereich), el('div','mut','Zeitraum: '+it.zeitraum));
  if(it.grund) row.append(el('div','mut','Grund: '+it.grund));
  if(it.hinweis) row.append(el('div',null,it.hinweis));
  if(color && !layers.length){ row.append(el('div','warn','⚠ Nicht auf der Karte verortet – bitte Text beachten!')); }
  row.onclick=()=>{ if(layers.length){ map.fitBounds(L.featureGroup(layers).getBounds().pad(.5)); layers[0].openPopup(); } };
  content.append(row);
});
