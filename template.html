<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spreewald – Sperrungen heute</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif}
  #wrap{display:flex;height:100%}
  #side{width:380px;max-width:42vw;overflow-y:auto;background:#fff;border-right:1px solid #ccc;padding:12px;box-sizing:border-box}
  #map{flex:1}
  h1{font-size:18px;margin:0 0 2px} .sub{color:#555;font-size:13px;margin-bottom:10px}
  .leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;margin-bottom:10px}
  .sw{display:inline-block;width:22px;height:0;border-top:5px solid;vertical-align:middle;margin-right:4px}
  .it{border:1px solid #ddd;border-left:6px solid #999;border-radius:4px;padding:6px 8px;margin-bottom:8px;font-size:13px;cursor:pointer}
  .it:hover{background:#f5f5f5} .it b{display:block}
  .badge{font-size:11px;font-weight:700;color:#fff;border-radius:3px;padding:1px 5px;margin-right:4px}
  .warn{color:#b00020;font-size:12px} .mut{color:#666;font-size:12px}
  h2{font-size:14px;margin:14px 0 6px}
  @media(max-width:700px){#wrap{flex-direction:column-reverse}#side{width:auto;max-width:none;height:40%}}
</style>
</head>
<body>
<div id="wrap">
  <div id="side"></div>
  <div id="map"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const D = __DATA__;
const COL = {gesperrt:'#d32f2f', eingeschraenkt:'#f57c00', bald:'#f9a825'};
const LAB = {gesperrt:'GESPERRT', eingeschraenkt:'EINGESCHRÄNKT', bald:'DEMNÄCHST', gebiet:'GEBIETSHINWEIS', ruht:'HEUTE NICHT AKTIV'};

const map = L.map('map').setView([51.86, 13.99], 11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'© OpenStreetMap-Mitwirkende'}).addTo(map);

function el(tag, cls, text){const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e;}
function popup(it){
  const d=el('div'); const b=el('b',null,it.gewaesser); d.append(b, el('div',null,LAB[it.status]+' – '+it.bereich));
  d.append(el('div','mut','Zeitraum: '+it.zeitraum), el('div',null,it.hinweis));
  if(it.paddel) d.append(el('div',null,'Paddelboote: Umtragen möglich'));
  if(!it.genau) d.append(el('div','warn','Abschnitt nur ungefähr eingezeichnet – Text beachten!'));
  return d;
}

const side=document.getElementById('side');
side.append(el('h1',null,'Sperrungen – '+D.datum));
side.append(el('div','sub','Quelle: LBV Brandenburg'+(D.stand?' (Stand '+D.stand+')':'')+'. Maßgeblich bleibt die Beschilderung vor Ort.'));
const leg=el('div','leg');
['gesperrt','eingeschraenkt','bald'].forEach(k=>{const s=el('span'); const w=el('span','sw'); w.style.borderColor=COL[k]; s.append(w,LAB[k]); leg.append(s);});
side.append(leg);

const all=L.featureGroup().addTo(map);
const order={gesperrt:0,eingeschraenkt:1,bald:2,gebiet:3,ruht:4};
const items=[...D.items].sort((a,b)=>order[a.status]-order[b.status]);

items.forEach(it=>{
  const layers=[];
  const color=COL[it.status];
  (it.geom||[]).forEach(g=>{
    const opt={color, weight:7, opacity:.9, dashArray: it.status==='bald'?'10 8':null};
    const lyr = g.t==='line' ? L.polyline(g.c,opt) : L.circle(g.c,{...opt,radius:g.r,weight:5,fillOpacity:.25});
    lyr.bindPopup(()=>popup(it)); lyr.addTo(all); layers.push(lyr);
  });
  const row=el('div','it'); row.style.borderLeftColor = color || '#999';
  const head=el('b'); const bd=el('span','badge',LAB[it.status]); bd.style.background=color||'#777';
  head.append(bd, it.gewaesser); row.append(head, el('div','mut',it.bereich), el('div','mut','Zeitraum: '+it.zeitraum));
  if(it.hinweis) row.append(el('div',null,it.hinweis));
  if(color && !layers.length){ row.append(el('div','warn','⚠ Nicht auf der Karte verortet – bitte Text beachten!')); }
  row.onclick=()=>{ if(layers.length){ map.fitBounds(L.featureGroup(layers).getBounds().pad(.5)); layers[0].openPopup(); } };
  side.append(row);
});
if(!items.length) side.append(el('div',null,'Keine Sperrungen oder Einschränkungen für diesen Tag gemeldet.'));
if(all.getLayers().length) map.fitBounds(all.getBounds().pad(.2));
</script>
</body>
</html>
